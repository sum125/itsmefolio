name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # main 브랜치에 push될 때마다 실행

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:   # 본인 Flutter 버전에 맞춰도 되고, 이대로 둬도 무방해요
          channel: 'stable'

      - name: 패키지 설치
        run: flutter pub get

      - name: 웹용 빌드 (base-href는 저장소 이름과 동일하게)
        run: flutter build web --release --base-href /itsmefolio/

      - name: gh-pages 브랜치로 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web